[pytest]
testpaths = tests
markers =
    smoke: smoke tests de login
    auth: autenticacion y logout
    rbac: control de acceso por rol
    pacientes: gestion de pacientes
    examenes: gestion de examenes
    resultados: mis resultados paciente
    case: metadata id/cp/name del caso
addopts = -v --tb=short
pythonpath = .
